<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RentReady Network — You're All Set</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,200;0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,300&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --green:        #1A4731;
  --green-mid:    #22593D;
  --green-bright: #2D7A52;
  --green-accent: #34A46C;
  --white:        #FFFFFF;
  --off-white:    #F3F6F3;
  --muted:        #637268;
  --muted-lt:     #A2B0A7;
  --border:       rgba(26,71,49,0.11);
  --border-md:    rgba(26,71,49,0.17);
  --font: -apple-system, BlinkMacSystemFont, 'DM Sans', 'Helvetica Neue', sans-serif;
  --ease-out:    cubic-bezier(0.16, 1, 0.3, 1);
}
html, body { min-height: 100%; font-family: var(--font); background: var(--off-white); color: var(--green); overflow-x: hidden; }
.bg { position: fixed; inset: 0; z-index: 0; background: var(--off-white); }
.blob { position: absolute; border-radius: 50%; filter: blur(90px); animation: drift 20s ease-in-out infinite alternate; }
.blob-1 { width: 660px; height: 660px; background: #2D7A52; opacity: 0.18; top: -180px; right: -120px; }
.blob-2 { width: 480px; height: 480px; background: #1A4731; opacity: 0.14; bottom: -100px; left: -130px; animation-delay: -9s; }
@keyframes drift { from { transform: translate(0,0) scale(1); } to { transform: translate(26px,-34px) scale(1.06); } }
.shell { position: relative; z-index: 1; min-height: 100dvh; display: flex; align-items: center; justify-content: center; padding: 24px; }
.card {
  width: 100%; max-width: 560px;
  background: rgba(255,255,255,0.94);
  backdrop-filter: blur(40px) saturate(180%);
  border-radius: 32px;
  border: 1px solid rgba(255,255,255,0.95);
  box-shadow: 0 2px 4px rgba(26,71,49,0.04), 0 16px 40px rgba(26,71,49,0.09), 0 60px 90px rgba(26,71,49,0.06);
  overflow: hidden;
  padding: 48px 44px;
  text-align: center;
}
@media (max-width:520px){ .card{ padding:36px 26px; border-radius:22px; } }
.brand { font-size: 15.5px; font-weight: 600; letter-spacing: -0.4px; color: var(--green); display: flex; align-items: center; justify-content: center; gap: 9px; margin-bottom: 34px; }
.brand-icon { width: 30px; height: 30px; background: var(--green); border-radius: 9px; display: flex; align-items: center; justify-content: center; }
.brand-icon svg { width: 15px; height: 15px; stroke: #fff; fill: none; }
.check-badge { width: 64px; height: 64px; margin: 0 auto 20px; border-radius: 50%; background: var(--green); display: flex; align-items: center; justify-content: center; box-shadow: 0 8px 28px rgba(26,71,49,0.28); animation: pop 0.5s var(--ease-out); }
@keyframes pop { from { transform: scale(0.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.check-badge svg { width: 28px; height: 28px; stroke: #fff; fill: none; }
.eyebrow { font-size: 10.5px; font-weight: 700; letter-spacing: 0.13em; text-transform: uppercase; color: var(--green-accent); margin-bottom: 10px; }
.title { font-size: 28px; font-weight: 300; letter-spacing: -0.8px; line-height: 1.2; color: var(--green); margin-bottom: 12px; }
.title strong { font-weight: 600; }
.subtitle { font-size: 14.5px; font-weight: 400; color: var(--muted); line-height: 1.6; margin-bottom: 26px; }
.links { display: flex; flex-direction: column; gap: 10px; text-align: left; }
.btn-primary { width: 100%; padding: 15px 20px; border: none; border-radius: 15px; background: var(--green); color: #fff; font-family: var(--font); font-size: 14.5px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; transition: transform 0.28s var(--ease-out), background 0.28s var(--ease-out), box-shadow 0.28s var(--ease-out); box-shadow:0 8px 24px rgba(26,71,49,.16); }
.btn-primary:hover { background: var(--green-mid); transform: translateY(-2px); box-shadow:0 12px 30px rgba(26,71,49,.24); }
.btn-primary svg { width: 15px; height: 15px; stroke: #fff; fill: none; }
.btn-secondary { width: 100%; padding: 14px 20px; border: 1.5px solid var(--border-md); border-radius: 15px; background: transparent; color: var(--green); font-family: var(--font); font-size: 13.5px; font-weight: 600; cursor: pointer; text-align: center; text-decoration: none; display: block; transition: background 0.28s var(--ease-out), border-color 0.28s var(--ease-out), transform 0.28s var(--ease-out); }
.btn-secondary:hover { background: rgba(26,71,49,0.05); border-color: var(--green); transform: translateY(-1px); }
.skeleton { color: var(--muted); font-size: 14px; }
</style>
</head>
<body>

<div class="bg"><div class="blob blob-1"></div><div class="blob blob-2"></div></div>

<div class="shell">
  <div class="card" id="content">
    <div class="brand">
      <div class="brand-icon"><svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5"/><path d="M5 10v10h14V10"/></svg></div>
      RentReady <strong>Network</strong>
    </div>
    <div class="skeleton">Loading…</div>
  </div>
</div>

<script src="/assets/checkout-client.js"></script>
<script>
const ANSWERS_KEY = 'rrn_answers_v1';
const START_URL = '/index.html';

function esc(s){ return (s==null?'':String(s)).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function loadAnswers() {
  try { return JSON.parse(sessionStorage.getItem(ANSWERS_KEY) || 'null'); }
  catch (_e) { return null; }
}

function svgCheck(){ return '<svg viewBox="0 0 24 24" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"/></svg>'; }
function svgArrow(){ return '<svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>'; }

function render(answers, ent) {
  const first = (answers && answers.first_name) || 'there';

  let subtitle;
  if (ent && ent.membershipStatus === 'active') {
    subtitle = 'Your RentReady Support access information is on its way to your email.';
  } else if (ent && ent.paid97) {
    subtitle = 'Your purchased RentReady resources have been sent to your email.';
  } else if (ent && ent.paid27) {
    subtitle = 'Your RentReady Game Plan has been sent to the email you provided.';
  } else {
    subtitle = 'Your RentReady results are ready whenever you need them.';
  }

  const links = [];
  if (ent && ent.paid10) {
    links.push(`<a class="btn-secondary" href="/.netlify/functions/download-result-pdf?leadId=${encodeURIComponent(answers.lead_id)}">Download My Pre-Screen Results</a>`);
  }
  if (ent && ent.paid27) {
    links.push(`<a class="btn-secondary" href="/.netlify/functions/download-file?leadId=${encodeURIComponent(answers.lead_id)}&product=gameplan">Download My Game Plan</a>`);
  }
  if (ent && ent.paid97) {
    links.push(`<a class="btn-secondary" href="/.netlify/functions/download-file?leadId=${encodeURIComponent(answers.lead_id)}&product=creditkit">Download My Credit Action Kit</a>`);
  }
  links.push(`<a class="btn-primary" href="/after-payment-results/">Back To My RentReady Results ${svgArrow()}</a>`);

  document.getElementById('content').innerHTML = `
    <div class="brand">
      <div class="brand-icon"><svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5"/><path d="M5 10v10h14V10"/></svg></div>
      RentReady <strong>Network</strong>
    </div>
    <div class="check-badge">${svgCheck()}</div>
    <div class="eyebrow">All Set</div>
    <div class="title">${esc(first)}, you're <strong>all set.</strong></div>
    <div class="subtitle">${subtitle}</div>
    <div class="links">${links.join('')}</div>
  `;
}

(async function boot() {
  const answers = loadAnswers();
  if (!answers || !answers.lead_id) {
    window.location.replace(START_URL);
    return;
  }
  const ent = await rrnFetchEntitlements(answers.lead_id);
  if (!ent || !ent.paid10) {
    window.location.replace(START_URL);
    return;
  }
  render(answers, ent);
})();
</script>
</body>
</html>
