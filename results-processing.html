<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RentReady Network — Preparing Your Results</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,200;0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,300&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --green:        #1A4731;
  --green-mid:    #22593D;
  --green-bright: #2D7A52;
  --green-accent: #34A46C;
  --white:        #FFFFFF;
  --off-white:    #F3F6F3;
  --muted:        #637268;
  --muted-lt:     #A2B0A7;
  --border:       rgba(26,71,49,0.11);
  --border-md:    rgba(26,71,49,0.17);
  --font: -apple-system, BlinkMacSystemFont, 'DM Sans', 'Helvetica Neue', sans-serif;
  --ease-butter: cubic-bezier(0.16, 1, 0.3, 1);
  --ease-out:    cubic-bezier(0.16, 1, 0.3, 1);
}
html, body { min-height: 100%; font-family: var(--font); background: var(--off-white); color: var(--green); overflow-x: hidden; }
.bg { position: fixed; inset: 0; z-index: 0; background: var(--off-white); }
.blob { position: absolute; border-radius: 50%; filter: blur(90px); animation: drift 20s ease-in-out infinite alternate; }
.blob-1 { width: 660px; height: 660px; background: #2D7A52; opacity: 0.18; top: -180px; right: -120px; }
.blob-2 { width: 480px; height: 480px; background: #1A4731; opacity: 0.14; bottom: -100px; left: -130px; animation-delay: -9s; }
@keyframes drift { from { transform: translate(0,0) scale(1); } to { transform: translate(26px,-34px) scale(1.06); } }
.shell { position: relative; z-index: 1; min-height: 100dvh; display: flex; align-items: center; justify-content: center; padding: 24px; }
.card {
  width: 100%; max-width: 560px;
  background: rgba(255,255,255,0.94);
  backdrop-filter: blur(40px) saturate(180%);
  border-radius: 32px;
  border: 1px solid rgba(255,255,255,0.95);
  box-shadow: 0 2px 4px rgba(26,71,49,0.04), 0 16px 40px rgba(26,71,49,0.09), 0 60px 90px rgba(26,71,49,0.06);
  overflow: hidden;
  padding: 48px 44px;
  text-align: center;
}
.brand { font-size: 15.5px; font-weight: 600; letter-spacing: -0.4px; color: var(--green); display: flex; align-items: center; justify-content: center; gap: 9px; margin-bottom: 34px; }
.brand-icon { width: 30px; height: 30px; background: var(--green); border-radius: 9px; display: flex; align-items: center; justify-content: center; }
.brand-icon svg { width: 15px; height: 15px; stroke: #fff; fill: none; }
.check-badge { width: 64px; height: 64px; margin: 0 auto 20px; border-radius: 50%; background: var(--green); display: flex; align-items: center; justify-content: center; box-shadow: 0 8px 28px rgba(26,71,49,0.28); animation: pop 0.5s var(--ease-out); }
@keyframes pop { from { transform: scale(0.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.check-badge svg { width: 28px; height: 28px; stroke: #fff; fill: none; }
.eyebrow { font-size: 10.5px; font-weight: 700; letter-spacing: 0.13em; text-transform: uppercase; color: var(--green-accent); margin-bottom: 10px; }
.title { font-size: 26px; font-weight: 300; letter-spacing: -0.8px; line-height: 1.2; color: var(--green); margin-bottom: 10px; }
.title strong { font-weight: 600; }
.subtitle { font-size: 14.5px; font-weight: 400; color: var(--muted); line-height: 1.6; margin-bottom: 30px; }
.checklist { display: flex; flex-direction: column; gap: 12px; text-align: left; margin-bottom: 8px; }
.check-row { display: flex; align-items: center; gap: 12px; padding: 13px 16px; border-radius: 14px; border: 1.5px solid var(--border); background: rgba(255,255,255,0.6); opacity: 0.35; transform: translateX(-6px); transition: opacity 0.52s var(--ease-out), transform 0.52s var(--ease-out), border-color 0.52s var(--ease-out), background 0.52s var(--ease-out); }
.check-row.done { opacity: 1; transform: translateX(0); border-color: rgba(26,71,49,0.22); background: rgba(52,164,108,0.07); }
.check-row .dot { width: 20px; height: 20px; border-radius: 50%; flex-shrink: 0; border: 2px solid var(--border-md); display: flex; align-items: center; justify-content: center; transition: background 0.32s var(--ease-out), border-color 0.32s var(--ease-out), transform 0.32s var(--ease-out); }
.check-row.done .dot { background: var(--green-accent); border-color: var(--green-accent); }
.check-row.done .dot svg { width: 11px; height: 11px; stroke: #fff; fill: none; }
.check-row .lbl { font-size: 13.5px; font-weight: 500; color: var(--muted); }
.check-row.done .lbl { color: var(--green); }
.progress-track { height: 4px; background: rgba(26,71,49,0.08); border-radius: 4px; margin-top: 28px; overflow: hidden; }
.progress-fill { height: 100%; width: 0%; background: linear-gradient(90deg, var(--green), var(--green-accent)); transition: width 0.5s var(--ease-butter); border-radius: 4px; }
.status-line { margin-top: 16px; font-size: 12.5px; color: var(--muted-lt); font-weight: 500; }
.checkout-panel { display: none; margin-top: 26px; text-align: left; }
.checkout-panel.show { display: block; }
.checkout-label { font-size: 12px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: var(--green); margin-bottom: 12px; }
.checkout-box { padding: 18px; border: 1.5px solid var(--border-md); border-radius: 16px; background: rgba(255,255,255,0.72); }
.pay-btn {
  width: 100%; margin-top: 16px; border: 0; border-radius: 14px; padding: 15px 18px;
  background: var(--green); color: #fff; font: 800 15px var(--font); cursor: pointer;
  box-shadow: 0 10px 26px rgba(26,71,49,0.22);
}
.pay-btn:disabled { cursor: not-allowed; opacity: 0.72; }
.pay-error { display: none; margin-top: 12px; color: #A63B32; font-size: 13px; line-height: 1.45; text-align: center; }
.pay-error.show { display: block; }
.fine { margin-top: 12px; font-size: 11px; line-height: 1.45; color: var(--muted); text-align: center; }
</style>
</head>
<body>

<div class="bg">
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
</div>

<div class="shell">
  <div class="card">
    <div class="brand">
      <div class="brand-icon"><svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5"/><path d="M5 10v10h14V10"/></svg></div>
      RentReady <strong>Network</strong>
    </div>

    <div class="check-badge"><svg viewBox="0 0 24 24" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"/></svg></div>
    <div class="eyebrow">Pre-Screen Complete</div>
    <div class="title">Reviewing your <strong>answers…</strong></div>
    <div class="subtitle" id="subtitle">We're preparing your personalized RentReady summary based on what you shared.</div>

    <div class="checklist" id="checklist"></div>

    <div class="progress-track"><div class="progress-fill" id="progFill"></div></div>
    <div class="status-line" id="statusLine">Starting…</div>
    <div class="checkout-panel" id="checkoutPanel">
      <div class="checkout-label">Secure pre-screen payment</div>
      <div class="checkout-box" id="paymentElement"></div>
      <button class="pay-btn" id="payBtn" type="button">Pay $10 &amp; View Results</button>
      <div class="pay-error" id="payError"></div>
      <p class="fine">One-time $10 pre-screen. Your card is handled securely by Stripe and saved only for any one-click upsell you choose later.</p>
    </div>
  </div>
</div>

<script src="https://js.stripe.com/v3/"></script>
<script>
const ANSWERS_STORAGE_KEY = 'rrn_answers_v1';
const RESULTS_URL = '/After%20Payment%20Results.html';
const FLOW_ACCESS_KEY = 'rrn_flow_access_v1';
let stripe = null;
let elements = null;
let paymentIntentId = '';

function loadAnswers() {
  try { return JSON.parse(sessionStorage.getItem(ANSWERS_STORAGE_KEY) || 'null'); }
  catch (_e) { return null; }
}

const answers = loadAnswers();

// Only list steps that reflect information the visitor actually provided.
const steps = [];
if (answers && answers.annual_income) steps.push('Income information received');
if (answers && answers.rent_budget) steps.push('Rent budget received');
if (answers && answers.credit_score) steps.push('Credit range received');
if (answers && answers.move_timeline) steps.push('Move timeline received');
steps.push('RentReady summary prepared');

if (!steps.length) {
  steps.push('Answers received', 'RentReady summary prepared');
}

const list = document.getElementById('checklist');
steps.forEach((label, i) => {
  const row = document.createElement('div');
  row.className = 'check-row';
  row.id = 'row-' + i;
  row.innerHTML = `<span class="dot"><svg viewBox="0 0 24 24" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"/></svg></span><span class="lbl">${label}</span>`;
  list.appendChild(row);
});

const progFill = document.getElementById('progFill');
const statusLine = document.getElementById('statusLine');
const checkoutPanel = document.getElementById('checkoutPanel');
const payBtn = document.getElementById('payBtn');
const payError = document.getElementById('payError');
const total = steps.length;

function showPaymentError(message) {
  payError.textContent = message || 'We could not start checkout. Please refresh and try again.';
  payError.classList.add('show');
}

function grantResultsAccess() {
  try {
    sessionStorage.setItem(FLOW_ACCESS_KEY, JSON.stringify({
      step: 'prescreen-results',
      status: 'confirmed',
      at: Date.now(),
    }));
  } catch (_e) {}
}

async function fetchJson(url, options) {
  const res = await fetch(url, options);
  const data = await res.json().catch(() => ({}));
  if (!res.ok || !data || data.ok === false) {
    throw new Error((data && data.error) || 'Request failed.');
  }
  return data;
}

async function alreadyPaid() {
  if (!answers || !answers.lead_id) return false;
  try {
    const data = await fetchJson('/.netlify/functions/get-entitlements?leadId=' + encodeURIComponent(answers.lead_id));
    return !!data.paid10;
  } catch (_e) {
    return false;
  }
}

async function initCheckout() {
  if (!answers || !answers.lead_id) {
    window.location.replace('/Renter%20LeadForm.html');
    return;
  }

  if (await alreadyPaid()) {
    grantResultsAccess();
    window.location.href = RESULTS_URL;
    return;
  }

  statusLine.textContent = 'Secure checkout ready.';
  checkoutPanel.classList.add('show');

  try {
    const config = await fetchJson('/.netlify/functions/config');
    const intent = await fetchJson('/.netlify/functions/create-payment-intent', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        leadId: answers.lead_id,
        email: answers.email || '',
        answers: answers,
      }),
    });

    paymentIntentId = intent.paymentIntentId;
    stripe = Stripe(config.stripePublishableKey);
    elements = stripe.elements({ clientSecret: intent.clientSecret });
    elements.create('payment').mount('#paymentElement');
  } catch (err) {
    payBtn.disabled = true;
    statusLine.textContent = 'Checkout needs attention.';
    showPaymentError(err.message);
  }
}

async function handlePayment() {
  if (!stripe || !elements || !paymentIntentId || payBtn.disabled) return;
  payError.classList.remove('show');
  payBtn.disabled = true;
  payBtn.textContent = 'Confirming payment...';
  statusLine.textContent = 'Confirming your payment...';

  try {
    const result = await stripe.confirmPayment({ elements, redirect: 'if_required' });
    if (result.error) throw new Error(result.error.message || 'Payment was not completed.');

    const confirmed = await fetchJson('/.netlify/functions/confirm-intent', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        leadId: answers.lead_id,
        paymentIntentId: result.paymentIntent ? result.paymentIntent.id : paymentIntentId,
        product: 'prescreen',
      }),
    });

    if (confirmed.status !== 'succeeded') throw new Error('Payment is still processing. Please try again in a moment.');
    grantResultsAccess();
    statusLine.textContent = 'Payment confirmed. Opening your results...';
    window.location.href = RESULTS_URL;
  } catch (err) {
    payBtn.disabled = false;
    payBtn.textContent = 'Pay $10 & View Results';
    statusLine.textContent = 'Payment not completed.';
    showPaymentError(err.message);
  }
}

payBtn.addEventListener('click', handlePayment);

let i = 0;
function tick() {
  if (i >= total) {
    statusLine.textContent = 'Preparing secure checkout...';
    initCheckout();
    return;
  }
  document.getElementById('row-' + i).classList.add('done');
  i++;
  progFill.style.width = Math.round((i / total) * 100) + '%';
  statusLine.textContent = i < total ? 'Reviewing your answers…' : 'Almost ready…';
  setTimeout(tick, 480);
}
setTimeout(tick, 400);
</script>
</body>
</html>
